# tiershift default policy. Copy this file and edit. Nothing here is hard-coded.
# Every threshold is a probability or score from Jev. Change a number, change the routing. No retraining.

providers:
  ollama:
    type: openai-compatible
    base_url: http://localhost:11434/v1
  deepseek:
    type: openai-compatible
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
  openai:
    type: openai-compatible
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
  anthropic:
    type: anthropic
    api_key_env: ANTHROPIC_API_KEY

# A tier lists models in preference order. The first model whose provider key is present wins.
# Within a tier, `budget.prefer` can reorder by price.
tiers:
  local:
    - ollama/qwen2.5:7b
  fast:
    - deepseek/deepseek-flash
    - openai/gpt-5.6-luna
    - anthropic/claude-haiku-4-5
  mid:
    - openai/gpt-5.6-terra
    - deepseek/deepseek-v4-pro
    - anthropic/claude-sonnet-5
  flagship:
    - anthropic/claude-fable-5-1
    - openai/gpt-5.6-sol
    - anthropic/claude-opus-5

# Per-model request overrides. `params` merge into the provider request body.
# Prices, context windows, and capabilities live in prices.yaml; run `tiershift sync-models --write` to refresh them from models.dev.
models:
  deepseek/deepseek-flash:
    params: { thinking: { type: disabled } }   # fast tier answers directly; v4-pro keeps thinking on
  openai/gpt-5.6-luna:
    params: { reasoning_effort: none }         # verified 2026-09-17: gpt-5.6 rejects function tools unless reasoning_effort is none
  openai/gpt-5.6-terra:
    params: { reasoning_effort: none }

defaults:
  max_tokens: 4096
  min_output_tokens: 1024      # floor for models with the `reasoning` cap: they spend output tokens thinking first, and a small budget returns an empty answer at full price

# Jev is pinned. Routing decisions depend on the model, so an upgrade must be a deliberate edit here, not a silent drift.
# Check https://docs.typesafe.ai/models for newer versions and re-run `tiershift tune` on your log before switching.
jev:
  model: jev-1.13.0

# Rules run in order. The first match sets the base tier.
# Signals: difficulty (0-2), stakes (0-2), output_length (0-2), needs_reasoning, has_code,
# ambiguous, creative, safety_sensitive, trivial_ack, mid_tier_ok (all 0-1 probabilities),
# plus difficulty_confidence, stakes_confidence, domain_confidence (0-1) and domain (string).
# Code signals: has_tools, tool_count, est_input_tokens, retries, step, turn_count. Overrides also see `tier`.
# A typo in a signal or tier name fails at load time with a did-you-mean hint.
rules:
  # Everything starts on the fast tier. A capable small model handles most prompts as well as a flagship does.
  - default: fast

# Overrides run after rules, in order. `at_least` raises to a floor. `at_most` lowers to a ceiling. `up` moves N tiers up.
# Escalate only on evidence. In the benchmark the flagship was strictly best on 3 of 120 prompts, and the mid tier
# beat it on hard prompts at a third of the cost. The flagship is reserved for high stakes and safety.
overrides:
  - when: needs_reasoning > 0.8 or difficulty >= 1.3   # proofs, debugging, planning, expert-level work
    at_least: mid
  - when: stakes > 1.5                 # a wrong answer costs real money, legal exposure, or production impact
    at_least: flagship
  - when: safety_sensitive > 0.7       # medical, legal, financial, or physical-safety advice
    at_least: flagship
  - when: has_tools and tier == local
    at_least: fast
  - when: retries >= 1                 # the previous attempt failed; move up one tier
    up: 1
  # Optional: send pure acknowledgements to a free local model. Off by default: in the benchmark a 7B local model
  # scored 4.2 on acknowledgements where the fast tier scored 4.7, for a saving of well under one cent per thousand.
  # - { when: trivial_ack > 0.8 and stakes < 0.5, at_most: local }
  # Conservative variant: every hard prompt to the flagship, and move up on low confidence.
  # - { when: difficulty >= 1.3, at_least: flagship }
  # - { when: difficulty_confidence < 0.5, up: 1 }

budget:
  max_cost_per_call: 0.10      # USD. Models above this estimate are skipped within a tier.
  prefer: order                # order | cheapest

log:
  enabled: true                # one JSON line per decision: signals, tier, model, cost. Never message text.
  path: .tiershift/decisions.jsonl

fallback: up                   # if the chosen model fails, retry one tier up
degrade: true                  # if no model at or above the chosen tier has a key, use the best one below and flag it
