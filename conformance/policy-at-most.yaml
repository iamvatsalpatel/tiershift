providers:
  p: { type: openai-compatible, base_url: http://localhost:1/v1 }
tiers:
  local:    [p/l]
  fast:     [p/f]
  mid:      [p/m]
  flagship: [p/x]
models:
  p/l: { price: { input: 0, output: 0 } }
  p/f: { price: { input: 0.2, output: 1.0 } }
  p/m: { price: { input: 2.0, output: 10.0 } }
  p/x: { price: { input: 10.0, output: 50.0 } }
rules:
  - { when: trivial_ack > 0.8, tier: local }
  - { when: difficulty < 0.5, tier: fast }
  - { when: difficulty < 1.3, tier: mid }
  - { default: flagship }
overrides:
  - { when: mid_tier_ok > 0.8 and stakes < 1.5, at_most: mid }
  - { when: stakes > 1.5,                at_least: flagship }
  - { when: safety_sensitive > 0.7,      at_least: flagship }
  - { when: needs_reasoning > 0.8,       at_least: mid }
  - { when: has_tools and tier == local, at_least: fast }
  - { when: difficulty_confidence < 0.5, up: 1 }
  - { when: retries >= 1,                up: 1 }
  - { when: domain == legal_finance or domain == "medical", at_least: mid }
